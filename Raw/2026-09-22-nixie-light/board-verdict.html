  </style><main><figure style="width:478px"><figcaption><b>TODAY</b> — the nixie: black glass in a row of paper plates. The odd one out, which is your point.</figcaption><div class="f" style="width:478px;height:300px;background-image:url('today.png');background-position:-20px -280px;background-size:518px auto"></div></figure><figure style="width:478px"><figcaption><b>A (recommended) — THE STAMP</b>: the verdict is stamped on the plate. A double-ruled box, tilted, the figure in the app's own display face; the ink is amber until the count is sure and red once a difference is confirmed (your rule), and it lands like the VERIFIED seal on the night sheet when the number changes. Same paper as its three siblings; nothing to add to the app; Lite Mode keeps it.</figcaption><div class="f" style="width:478px;height:300px;background-image:url('st-a.png');background-position:-20px -280px;background-size:518px auto"></div></figure><figure style="width:478px"><figcaption><b>B — THE ENGRAVED WELL</b>: the figure cut into the plate. A recessed well in the plate's own tone, the figure bigger, a bar under it in the state's colour. The quietest of the three; the plate row grows a little taller.</figcaption><div class="f" style="width:478px;height:300px;background-image:url('st-b.png');background-position:-20px -280px;background-size:518px auto"></div></figure><figure style="width:478px"><figcaption><b>C — WRITTEN BY HAND</b>: the foreman writes the shortfall on the printed sheet. A marker script, tilted, in the state's ink. The least standard thing on the screen. Cost: a handwriting font packed into the app (about 40 KB) so every phone has it offline; a scrawled 0 and 6 need care at this size.</figcaption><div class="f" style="width:478px;height:300px;background-image:url('st-c.png');background-position:-20px -280px;background-size:518px auto"></div></figure><figure style="width:478px"><figcaption><b>A in the dark theme</b> — the same stamp on the dark plate, gold rules. One design, two materials.</figcaption><div class="f" style="width:478px;height:300px;background-image:url('st-a-dark.png');background-position:-20px -280px;background-size:518px auto"></div></figure></main>

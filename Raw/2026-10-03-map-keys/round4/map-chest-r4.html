<!doctype html>
<html lang="en" data-view="pc" data-marks="chest3" data-keys="icon" data-ergo="new" data-glow="sale">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journey Map Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Journey Plan's map, round 2 (2026-10-03): the keys keep his pick ("icon acts"); the shop marks are game objects
   with a SECURE MOMENT. Colours from src/styles/theme.css (dark); a game object may keep its own colours (his rule,
   2026-09-22: "i like the brown color chest dont need to follow the theme"). Lite = the app's kill list: no animation,
   no transition, no box-shadow, no text-shadow, no filter - every mark must still read in its end state. */
:root {
  color-scheme: dark;
  --ground: #0A0908; --sunk: #050403; --panel: #121110; --raised: #1B1917; --inset: #0E0D0C;
  --line: #26231F; --line-2: #3E3A35; --line-3: #6A645C;
  --ink: #E8E4DE; --ink-muted: #A39B90; --ink-dim: #928B81;
  --gold: #D08A2E; --gold-2: #E4B04A;
  --led-crit: #FF3B4B; --led-warn: #FFB020;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --font-pixel: "Silkscreen", var(--font-mono);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --slow: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ---- the chooser (not app UI) ---- */
.top { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line-2); background: var(--panel); }
.top h1 { margin: 0; font: 900 22px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.top h1 small { font: 700 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-dim); margin-left: 10px; }
.rows { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grp > span { font: 700 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); min-width: 74px; }
.seg { display: flex; border: 1px solid var(--line-3); border-radius: 8px; overflow: hidden; }
.seg button { min-height: 38px; padding: 0 12px; background: var(--raised); border: 0; border-left: 1px solid var(--line-2); cursor: pointer;
  font: 800 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--ink-muted); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--inset); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-2); }
.tog { min-height: 38px; padding: 0 12px; border: 1px solid var(--line-3); border-radius: 8px; background: var(--raised); cursor: pointer;
  font: 800 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--ink-muted); }
.tog[aria-pressed="true"] { color: var(--ink); border-color: var(--gold-2); }
.go { border-color: var(--gold); color: var(--ink); }

.wrap { padding: 16px; display: grid; gap: 14px; justify-items: center; }
.note { max-width: 1000px; width: 100%; margin: 0; font-size: 14px; color: var(--ink-muted); }
.note b { color: var(--ink); }

/* ---- the map ---- */
.map { position: relative; overflow: hidden; border: 1px solid var(--line-2); border-radius: 16px; background: #545557 url(ground.jpg) 50% 46% / 2048px auto;
  transition: background-position calc(900ms * var(--slow)) var(--ease-out); width: min(1000px, 100%); height: 500px; }
html[data-view="phone"] .map { width: min(390px, 100%); height: 760px; border-radius: 22px; }
.map.flown { background-position: 44% 40%; }
.layer { position: absolute; inset: 0; }
.borders { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity calc(240ms * var(--slow)) ease; pointer-events: none; }
.map.bordered .borders { opacity: 1; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.zoom { position: absolute; top: 16px; left: 16px; display: grid; border: 1px solid var(--line-3); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
.zoom i { width: 34px; height: 34px; display: grid; place-items: center; background: var(--panel); color: var(--ink); font: 700 20px/1 var(--font-body); font-style: normal; }
.zoom i + i { border-top: 1px solid var(--line-2); }
.attrib { position: absolute; right: 0; bottom: 0; padding: 2px 6px; background: rgba(10,9,8,.72); color: var(--ink-dim); font: 11px/1.3 var(--font-body); }

/* salesman chips (the expedition, unchanged) */
.chip { position: absolute; width: 36px; height: 48px; translate: -50% -100%; display: grid; justify-items: center; align-content: start; pointer-events: none; }
.chip b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(160deg, #E4C98E, #B8893A);
  color: #2a1d08; font: 900 12px/1 var(--font-mono); border: 3px solid #A39B90; outline: 2px solid #0A0908; }
.chip > i { width: 2px; height: 10px; background: #E4B04A; }
.chip span { position: absolute; left: 42px; top: 9px; font: 800 10px/1 var(--font-mono); letter-spacing: .1em; color: #E8E4DE;
  background: #0A0908; border: 1px solid #6A645C; border-radius: 4px; padding: 3px 5px; white-space: nowrap; }

/* ================= SHOP MARKS ================= */
.m { position: absolute; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.m .art { transition: transform calc(180ms * var(--slow)) var(--ease-out); transform-origin: 50% 100%; }
.m .hop { transform-origin: 50% 100%; }
@media (hover: hover) and (pointer: fine) { .m:hover .art { transform: translateY(-3px); } }
.m:active .art { transform: scale(.92); transition-duration: calc(80ms * var(--slow)); }
/* the hop every look plays at its secure moment: squash, jump, land */
.m.burst .hop { animation: hop calc(560ms * var(--slow)) var(--ease-out); }
@keyframes hop { 0% { transform: none; } 18% { transform: scale(1.16, .8); } 42% { transform: translateY(-8px) scale(.92, 1.1); } 68% { transform: scale(1.08, .93); } 100% { transform: none; } }
.px { shape-rendering: crispEdges; display: block; overflow: visible; }
/* sparks: pixel squares that fly out once - decoration of the moment, never the state */
.fx { position: absolute; left: 50%; top: 2px; width: 0; height: 0; pointer-events: none; }
.fx i { position: absolute; width: 4px; height: 4px; background: #FFE2A0; opacity: 0; }
.fx i:nth-child(2n) { background: #E4B04A; width: 3px; height: 3px; }
.m.burst .fx i { animation: spark calc(680ms * var(--slow)) var(--ease-out) calc(120ms * var(--slow)); }
@keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } }
.st { position: absolute; width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center; background: #0A0908; border: 1px solid var(--line-3); color: var(--ink); }
.st svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.st.crit { color: var(--led-crit); border-color: #7a2a30; }
.st.warn { color: var(--led-warn); }

/* --- TODAY: what kpm d321daf draws --- */
.t-cl { translate: -50% -50%; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(18,17,16,.95); border: 2px solid #D08A2E;
  color: #E4B04A; font: 900 14px/1 monospace; box-shadow: 0 0 20px rgba(249,115,22,.5); }
.t-pin { translate: -50% -50%; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #1B1917; border: 2px solid var(--c);
  font-size: 12px; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent); }

/* --- 1 · BANNER: a Minecraft map banner. The cloth is the salesman's colour (the game's own rule: a banner's mark
       takes the banner's colour). Furled = not visited; secured = the banner is RAISED, its tip turns amber. --- */
.ban-pin { width: 20px; height: 34px; translate: -3px -100%; }             /* the pole's foot sits on the shop */
.ban-pin svg { width: 20px; height: 34px; }
.ban-pin .cloth { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(.3); transition: transform calc(460ms * var(--slow)) var(--spring); }
.ban-pin.lit .cloth { transform: scaleY(1); }
.ban-pin .fin { fill: #8A8178; transition: fill calc(200ms * var(--slow)) ease; }
.ban-pin.lit .fin { fill: #E4B04A; }
.ban-pin .cc { fill: var(--c); } .ban-pin .cs { fill: color-mix(in srgb, var(--c) 62%, #000); }
.ban-pin.burst .cloth { animation: wave calc(760ms * var(--slow)) ease-in-out calc(400ms * var(--slow)); }
@keyframes wave { 0%, 100% { transform: scaleY(1) skewY(0); } 30% { transform: scaleY(1) skewY(-7deg); } 62% { transform: scaleY(1) skewY(4deg); } 84% { transform: scaleY(1) skewY(-1.5deg); } }
.ban-pin .fx { left: 4px; top: 31px; }
.ban-pin .st { left: 17px; top: 0; }

/* --- 2 · CHEST: a shop is a chest; secured = the chest stands OPEN with warm light inside. The ring under it is
       the salesman's colour, like a selected unit in a strategy game. --- */
.chest-pin { width: 24px; height: 22px; translate: -50% -80%; }
.chest-pin svg { width: 24px; height: 22px; position: relative; }
.chest-pin .ring { position: absolute; left: 50%; bottom: -5px; width: 32px; height: 12px; translate: -50% 0; border-radius: 50%; border: 2px solid var(--c);
  background: rgba(10,9,8,.5); z-index: -1; }
.chest-pin .lid { transform-box: fill-box; transform-origin: 50% 0; transition: transform calc(340ms * var(--slow)) var(--spring); }
.chest-pin.lit .lid { transform: translateY(-2.6px) scaleY(.48); }
.chest-pin .glow, .chest-pin .beam { opacity: 0; transition: opacity calc(260ms * var(--slow)) ease; }
.chest-pin .beam { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.2); transition: opacity calc(260ms * var(--slow)) ease, transform calc(460ms * var(--slow)) var(--ease-out); }
.chest-pin.lit .glow { opacity: 1; }
.chest-pin.lit .beam { opacity: .9; transform: scaleY(1); }
.chest-pin.closed svg { opacity: .55; }
.chest-pin .st { left: 19px; top: -9px; }

/* --- CHEST, FIXED (his note: "since it is small, secured stores and unvisited stores looks almost the same"). Three
       signals instead of one: SHAPE (open = a taller chest, the lid standing up), BRIGHTNESS (closed = dim wood, open =
       bright wood with light inside) and LIGHT (a beam above + a warm pool on the ground). The swap of the two sprites
       is a state, not an animation, so Lite shows the open chest at once. --- */
.ch2 { width: 24px; height: 28px; translate: -50% -88%; }
.ch2 .spr { position: absolute; left: 0; bottom: 0; width: 24px; }
.ch2 .open { opacity: 0; }
.ch2.lit .shut { opacity: 0; transition: opacity 0s linear calc(150ms * var(--slow)); }
.ch2.lit .open { opacity: 1; transition: opacity 0s linear calc(150ms * var(--slow)); }
.ch2 .ring { position: absolute; left: 50%; bottom: -5px; width: 30px; height: 11px; translate: -50% 0; border-radius: 50%; border: 2px solid var(--c); background: rgba(10,9,8,.55); z-index: -1; }
.ch2 .pool { position: absolute; left: 50%; bottom: -12px; width: 54px; height: 24px; translate: -50% 0; border-radius: 50%; z-index: -2; opacity: 0;
  background: radial-gradient(closest-side, rgba(255,205,120,.75), rgba(228,176,74,.28) 55%, transparent); transition: opacity calc(320ms * var(--slow)) ease calc(150ms * var(--slow)); }
.ch2.lit .pool { opacity: 1; }
.ch2 .beam { position: absolute; left: 1px; right: 1px; bottom: 14px; height: 22px; clip-path: polygon(14% 100%, 86% 100%, 100% 0, 0 0); transform-origin: 50% 100%;
  background: linear-gradient(to top, rgba(255,220,150,.85), rgba(255,200,110,0)); opacity: 0; transform: scaleY(.15);
  transition: opacity calc(240ms * var(--slow)) ease calc(150ms * var(--slow)), transform calc(480ms * var(--slow)) var(--ease-out) calc(150ms * var(--slow)); }
.ch2.lit .beam { opacity: .8; transform: none; }
.ch2.burst .open { animation: pop calc(380ms * var(--slow)) var(--spring) calc(150ms * var(--slow)); transform-origin: 50% 100%; }
@keyframes pop { 0% { transform: scale(.85, 1.15); } 100% { transform: none; } }
.ch2.burst .fx { top: -4px; }
.ch2.closed .shut { opacity: .6; }
.ch2 .st { left: 20px; top: -4px; }
.slot .item.two { position: relative; width: 24px; height: 28px; }
.slot .item.two svg { position: absolute; left: 0; bottom: 0; }
.slot .item.two .open, .slot.full .item.two .shut { opacity: 0; }
.slot.full .item.two .open { opacity: 1; }

/* --- CHEST v4 (his OK of the chest + "make sure the animation is smooth and correct" + a sign for the store's
       status). ONE sprite whose lid LIFTS (no picture swap), a sign planted beside it with the visit's outcome, and a
       hop eased like gravity: slows on the way up, speeds up on the way down, squashes on landing.
       The END state is the plain style; the moment is keyframes FROM the closed values. That is also how it must ship:
       Leaflet replaces a marker's element when its icon changes, so only a fresh element's animation can play - here
       every state change replaces the element too. Lite: no animation, the end state shows at once. --- */
.ch3 { width: 24px; height: 28px; translate: -50% -88%; }
/* the wrappers must be as big as the mark: a transform (the hop, the hover lift) makes the wrapper the box the chest is
   placed against, and a 0-height wrapper threw the chest 28 px up for as long as the hop's fill lasted (seen in the
   round-3 frames, 2026-10-03) */
.ch3 .art, .ch3 .hop { position: absolute; inset: 0; }
.ch3 svg.chest { position: absolute; left: 0; bottom: 0; width: 24px; height: 28px; overflow: visible; }
/* the lid swings on its hinge: its front face tilts away (rises, gets shorter, goes edge-on), then the lid's dark
   INSIDE face unfolds upward - the way a 2D game fakes a 3D turn. Open = the inside face standing up. */
.ch3 .lidF, .ch3 .lidU { transform-box: fill-box; transform-origin: 50% 100%; }
.ch3 .lidF { transform: translateY(3px); }
.ch3 .lidU { opacity: 0; }
.ch3.v:not(.shut) .lidF { opacity: 0; transform: scaleY(.15); }
.ch3.v:not(.shut) .lidU { opacity: 1; }
.ch3 .bright { opacity: 0; } .ch3.v .bright { opacity: 1; }
.ch3 .gin { opacity: 0; } .ch3.sale .gin { opacity: 1; }
.ch3 .ring { position: absolute; left: 50%; bottom: -5px; width: 30px; height: 11px; translate: -50% 0; border-radius: 50%; border: 2px solid var(--c); background: rgba(10,9,8,.55); z-index: -1; }
.ch3 .pool { position: absolute; left: 50%; bottom: -12px; width: 54px; height: 24px; translate: -50% 0; border-radius: 50%; z-index: -2; opacity: 0;
  background: radial-gradient(closest-side, rgba(255,205,120,.75), rgba(228,176,74,.28) 55%, transparent); }
.ch3.sale .pool { opacity: 1; }
.ch3 .beam { position: absolute; left: 1px; right: 1px; bottom: 14px; height: 22px; clip-path: polygon(14% 100%, 86% 100%, 100% 0, 0 0); transform-origin: 50% 100%;
  background: linear-gradient(to top, rgba(255,220,150,.85), rgba(255,200,110,0)); opacity: 0; }
.ch3.sale .beam { opacity: .8; }
.ch3 .sign { position: absolute; left: 14px; bottom: -7px; width: 18px; height: 18px; display: none; transform-origin: 50% 100%; }
.ch3.v .sign { display: block; }
.ch3 .sign svg { width: 18px; height: 18px; display: block; }
.ch3:not(.sale) .fx { display: none; }
.ch3.burst .hop { animation: hop2 calc(600ms * var(--slow)) both; }
@keyframes hop2 {
  0%   { transform: none; animation-timing-function: cubic-bezier(.3, 0, .5, 1); }
  16%  { transform: scale(1.14, .84); animation-timing-function: cubic-bezier(.2, .6, .35, 1); }
  44%  { transform: translateY(-9px) scale(.94, 1.08); animation-timing-function: cubic-bezier(.55, 0, .85, .35); }
  64%  { transform: scale(1.1, .9); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
  82%  { transform: scale(.98, 1.02); }
  100% { transform: none; }
}
.ch3.burst:not(.shut) .lidF { animation: lid-tilt calc(190ms * var(--slow)) cubic-bezier(.5, 0, .9, .6) calc(220ms * var(--slow)) both; }
@keyframes lid-tilt { from { opacity: 1; transform: translateY(3px); } 92% { opacity: 1; } to { opacity: 0; transform: scaleY(.15); } }
.ch3.burst:not(.shut) .lidU { animation: lid-unfold calc(340ms * var(--slow)) var(--spring) calc(400ms * var(--slow)) both; }
@keyframes lid-unfold { from { opacity: 1; transform: scaleY(0); } to { opacity: 1; transform: none; } }
.ch3.burst .bright { animation: fade-in calc(240ms * var(--slow)) ease calc(150ms * var(--slow)) both; }
.ch3.burst .gin { animation: fade-in calc(200ms * var(--slow)) ease calc(280ms * var(--slow)) both; }
.ch3.burst .beam { animation: beam-up calc(480ms * var(--slow)) var(--ease-out) calc(300ms * var(--slow)) both; }
.ch3.burst .pool { animation: fade-in calc(320ms * var(--slow)) ease calc(300ms * var(--slow)) both; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes beam-up { from { opacity: 0; transform: scaleY(.15); } }
.ch3.burst .fx i { animation-delay: calc(300ms * var(--slow)); }
.ch3.burst .sign { animation: plant calc(380ms * var(--slow)) var(--spring) calc(540ms * var(--slow)) both; }
.ch3.resign .sign { animation: plant calc(380ms * var(--slow)) var(--spring) both; }
.ch3.resign .beam { animation: beam-up calc(480ms * var(--slow)) var(--ease-out) both; }
.ch3.resign .pool, .ch3.resign .gin { animation: fade-in calc(300ms * var(--slow)) ease both; }
@keyframes plant { from { opacity: 0; transform: translateY(-12px) rotate(-8deg); } }

/* the legend under the map (prototype only - in the app the meaning lives in the store's own card and the ponder book) */
.legend { max-width: 1000px; width: 100%; display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel); }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }
.legend b { color: var(--ink); font-weight: 700; }
.legend svg { width: 27px; height: 27px; }

/* --- 3 · BEACON: a dormant hex switches ON - a ring of light rushes out, the edge powers up round the hex, a short
       pillar of light stands on it (Division's map, a game waypoint). --- */
.bea-pin { width: 24px; height: 24px; translate: -50% -50%; }
.bea-pin svg { width: 24px; height: 24px; display: block; overflow: visible; position: relative; }
.bea-pin .body { fill: rgba(14,13,12,.92); }
.bea-pin .seg line { stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; }
.bea-pin .core { fill: #3E3A35; transform-box: fill-box; transform-origin: center; transition: fill calc(200ms * var(--slow)) ease; }
.bea-pin.lit .core { fill: #FFD48A; }
.bea-pin .halo { position: absolute; inset: -14px; border-radius: 50%; opacity: 0; background: radial-gradient(circle, rgba(255,196,110,.5) 0, rgba(228,176,74,.16) 38%, transparent 68%);
  transition: opacity calc(300ms * var(--slow)) ease; }
.bea-pin.lit .halo { opacity: 1; }
.bea-pin .pillar { position: absolute; left: 50%; bottom: 50%; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; transform-origin: 50% 100%; transform: scaleY(0);
  background: linear-gradient(to top, rgba(255,214,140,.95), rgba(255,200,110,0)); transition: transform calc(420ms * var(--slow)) var(--spring); }
.bea-pin.lit .pillar { transform: scaleY(1); }
.bea-pin .shock { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.bea-pin .shock polygon { fill: none; stroke: #FFD48A; stroke-width: 1.4; }
.bea-pin.burst .shock { animation: shock calc(680ms * var(--slow)) var(--ease-out); }
@keyframes shock { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(2.9); } }
.bea-pin.burst .seg line { animation: power calc(420ms * var(--slow)) ease-out both; animation-delay: calc(var(--i) * 45ms * var(--slow)); }
@keyframes power { 0% { stroke: #FFF4DC; stroke-width: 3.6; } 100% { stroke: var(--c); stroke-width: 2.4; } }
.bea-pin.burst .core { animation: core calc(420ms * var(--slow)) var(--spring); }
@keyframes core { 0% { transform: scale(.3); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
.bea-pin.burst .hop { animation: none; }
.bea-pin .st { left: 20px; top: -8px; }

/* --- clusters for BANNER and CHEST: a Minecraft inventory slot holding the item, the shop count bottom-right like a
       stack, and a bar under it that fills amber as the shops inside are secured. Full = the item's enchant shine. --- */
.slot { translate: -50% -50%; }
.slot .hop { position: relative; width: 42px; height: 42px; background: #8B8B8B; border: 3px solid; border-color: #373737 #FFFFFF #FFFFFF #373737; display: grid; place-items: center; }
.slot .item { display: block; }
.slot .cnt { position: absolute; right: 1px; bottom: -2px; font: 700 15px/1 var(--font-pixel); color: #FFFFFF; z-index: 1; }
.slot .cnt::before { content: attr(data-n); position: absolute; left: 2px; top: 2px; color: #3F3F3F; z-index: -1; }
.slot .dur { position: absolute; left: 0; right: 0; top: calc(100% + 4px); height: 5px; background: #0A0908; border: 1px solid #0A0908; }
.slot .dur i { position: absolute; inset: 0; background: #E4B04A; transform-origin: 0 50%; transform: scaleX(var(--f)); transition: transform calc(420ms * var(--slow)) var(--ease-out); }
.slot.full .hop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(186,120,255,.35) 46%, rgba(255,214,140,.30) 54%, transparent 70%);
  background-size: 300% 100%; background-position: 0 0; pointer-events: none; }
.slot.full.burst .hop::after { animation: glint calc(900ms * var(--slow)) ease-in-out; }
@keyframes glint { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* --- cluster for BEACON: a big hex; one edge lights amber per sixth of the shops secured; the number decodes on a tap --- */
.hexcl { translate: -50% -50%; width: 48px; height: 48px; }

/* ================= KEYS (his pick: the icon acts) ================= */
.key { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--panel);
  color: var(--ink-muted); box-shadow: 0 6px 20px rgba(0,0,0,.45); cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform calc(140ms * var(--slow)) var(--ease-out), border-color calc(140ms * var(--slow)) ease, color calc(140ms * var(--slow)) ease; }

.key:active { transform: scale(.97); }

.k-full:is(:active, .act) path:nth-child(1) { transform: translate(-2px, -2px); }
.k-full:is(:active, .act) path:nth-child(2) { transform: translate(2px, -2px); }
.k-full:is(:active, .act) path:nth-child(3) { transform: translate(-2px, 2px); }
.k-full:is(:active, .act) path:nth-child(4) { transform: translate(2px, 2px); }

.k-bord:is(:active, .act) path:nth-child(3) { transform: translateY(1.5px); }

@media (hover: hover) and (pointer: fine) {

/* pixel art: one letter per pixel, '.' = empty; runs of one colour become one rect */
function px(rows, pal) {
  let out = '';
  rows.forEach((row, y) => { for (let x = 0; x < row.length;) { const ch = row[x]; let w = 1; while (row[x + w] === ch) w++; if (ch !== '.') out += `<rect x="${x}" y="${y}" width="${w}" height="1" ${pal[ch]}/>`; x += w; } });

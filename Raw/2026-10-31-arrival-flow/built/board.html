<!doctype html>
<meta charset="utf-8">
<title>Arrival Flow Built</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* The built Sales Terminal, shot from the real code in the lab: one row of phone frames, then the PC. Dark board on purpose. */
:root { --ground: #0b0a09; --line: #2b2621; --ink: #efe8db; --muted: #a39b90; --gold: #e2b64a; --amber: #d08a2e;
  --display: "Rajdhani", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 500 17px/1.45 var(--display); padding: 24px 16px 36px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
h1 { margin: 0; font: 700 26px/1.15 var(--display); letter-spacing: .02em; }
p { margin: 0; color: var(--muted); max-width: 90ch; }
.row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.pc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
img { width: 100%; height: auto; display: block; border: 1px solid var(--gold); border-radius: 10px; }
figcaption { font: 700 12px/1.3 var(--mono); letter-spacing: .06em; color: var(--gold); }
</style>
<div class="wrap">
  <h1>Built: the Sales Terminal arrival flow</h1>
  <p>Real code in the lab, phone 375 px and PC 1440. TAKE ORDER is now a dark plate with an amber edge, the same as the ware + buttons, not the bright fill.</p>
  <div class="row">
    <figure><img src="b-arrive.png" alt=""><figcaption>1 · GPS FINDS THE SHOP</figcaption></figure>
    <figure><img src="b-arrive-light.png" alt=""><figcaption>1 · LIGHT MODE</figcaption></figure>
    <figure><img src="b-flag.png" alt=""><figcaption>2 · TAKE ORDER, + A WARE</figcaption></figure>
    <figure><img src="b-open.png" alt=""><figcaption>3 · MANIFEST PULLED OUT</figcaption></figure>
    <figure><img src="b-request.png" alt=""><figcaption>NEW REQUEST ASKS ONE LINE</figcaption></figure>
  </div>
  <div class="pc">
    <figure><img src="c-arrive.png" alt=""><figcaption>PC · THE SAME QUESTION AS A CARD</figcaption></figure>
    <figure><img src="c-order.png" alt=""><figcaption>PC · MANIFEST STAYS THE LEFT COLUMN</figcaption></figure>
  </div>
</div>

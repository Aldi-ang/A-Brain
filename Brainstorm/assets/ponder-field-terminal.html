<title>Ponder Field Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --housing-top:#252A2E; --housing-hi:#1C1F22; --housing-lo:#0E1012;
  --display:#121014;
  --ink:#E8E3DA; --dim:#8E8779;
  --accent:#FF8C1A; --foil:#FFD9A0;
  /* THE LIT COLOUR. Every indicator on this pad is black until it is lit, and then it is this
     one light amber - the edge meter cell, the key-cap lamp, and the latched cap's own face.
     One lit colour means "lit" is never ambiguous. */
  --lit:#F59E0B; --lit-dim:rgba(245,158,11,.38); --lit-hot:#FFC24D;
  /* The one entrance curve. Built-in ease-out is too weak to read as intentional, and a curve
     invented per animation is how a file ends up with six of them that nearly match. */
  --ease-out:cubic-bezier(.23, 1, .32, 1);
  --hair:rgba(232,227,218,.09);
  --hair-2:rgba(232,227,218,.16);
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --tx:0; --ty:0;
}
*{box-sizing:border-box}
body{
  margin:0; background:#08090A; color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 70% at 50% -10%, #14171A 0%, #08090A 62%);
}

/* the bench the pad sits on */
.frame{
  min-height:100dvh; display:grid; place-items:center;
  padding:clamp(6px,2.2vw,30px); perspective:1400px;
}

/* HOUSING - milled slate, gold anodised rim */
.pad{
  position:relative;
  width:min(424px,100%);
  height:min(880px, calc(100dvh - 2*clamp(6px,2.2vw,30px)));
  min-height:540px;
  padding:11px 9px;
  display:grid; grid-template-columns:15px minmax(0,1fr) 80px; column-gap:8px;
  border-radius:24px;
  background:linear-gradient(158deg, var(--housing-top) 0%, var(--housing-hi) 32%, #15181B 68%, var(--housing-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,217,160,.13),
    inset 0 -1px 0 rgba(0,0,0,.7),
    0 44px 90px -34px #000,
    0 4px 14px -6px rgba(0,0,0,.9);
  transform-style:preserve-3d;
  transform:rotateY(calc(var(--tx) * 5.5deg)) rotateX(calc(var(--ty) * -4.5deg));
  transition:transform .18s cubic-bezier(.22,.61,.36,1);
}
.pad::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
  background:linear-gradient(calc(148deg + var(--tx) * 30deg),
    rgba(255,217,160,.60) 0%, rgba(255,140,26,.30) 26%,
    rgba(255,217,160,.05) 52%, rgba(255,140,26,.22) 74%, rgba(255,217,160,.48) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
}
/* Milled grain only. The sweeping light band that used to cross the face is GONE -
   Aldi, 2026-09-02: "the backlight is too much ... i dont think its convenience to look
   at in the long term". Tilt still reads through the housing rotation, the parallax
   between rail and display, and the anodised rim's shifting gradient. The grain sits at
   Z 0 and FIRST in the DOM, so the display and the rail paint over it - the milling is on
   the housing, never across the words. */
.sheen{
  position:absolute; inset:0; border-radius:inherit; pointer-events:none; overflow:hidden;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
}
.bolt{
  position:absolute; width:5px; height:5px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #33383C, #0B0D0E 70%);
  box-shadow:inset 0 .5px 0 rgba(255,217,160,.22), 0 .5px 0 rgba(0,0,0,.8);
}
.bolt.tl{top:7px;left:6px} .bolt.tr{top:7px;right:6px}
.bolt.bl{bottom:7px;left:6px} .bolt.br{bottom:7px;right:6px}

/* LEFT EDGE - the one progress meter */
.meter{
  display:flex; flex-direction:column; gap:2px; padding:14px 3px;
  transform:translateZ(5px);
}
/* BLACK UNTIL LIT. An unlit cell is a black well, not a dim version of the lit one. */
.seg{
  flex:1 1 0; border-radius:2px;
  background:#000;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.9), inset 0 1px 1px rgba(0,0,0,.7);
  transition:background .25s linear, box-shadow .25s linear;
}
.seg.read{
  background:var(--lit-dim);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5);
}
/* the current cell ENERGISES - overbright for a moment, then settles to its burn level */
@keyframes segOn{
  0%  {background:var(--lit-hot); box-shadow:0 0 12px rgba(245,158,11,.85), inset 0 0 0 .5px rgba(0,0,0,.4)}
  55% {background:var(--lit);     box-shadow:0 0 7px  rgba(245,158,11,.55), inset 0 0 0 .5px rgba(0,0,0,.4)}
  100%{background:var(--lit);     box-shadow:0 0 4px  rgba(245,158,11,.40), inset 0 0 0 .5px rgba(0,0,0,.4)}
}
.seg.cur{
  background:var(--lit);
  box-shadow:0 0 4px rgba(245,158,11,.40), inset 0 0 0 .5px rgba(0,0,0,.4);
  animation:segOn .40s cubic-bezier(.2,.7,.3,1);
}

/* DISPLAY - inset, near-black warm */
.display{
  position:relative; border-radius:12px; background:var(--display);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:
    inset 0 2px 7px rgba(0,0,0,.95),
    inset 0 0 0 1px rgba(0,0,0,.85),
    0 0 0 1px rgba(232,227,218,.055);
}
.display::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(232,227,218,.016) 0 1px, transparent 1px 24px);
}
.status{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-bottom:1px solid var(--hair);
  font-family:var(--mono); font-size:9px; font-weight:500; letter-spacing:.14em;
  color:var(--dim); text-transform:uppercase; font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg, rgba(232,227,218,.035), transparent);
}
.status .live{width:5px; height:5px; border-radius:50%; background:var(--lit); flex:0 0 auto}
.status .sp{flex:1 1 auto}
.status b, .foot b{color:var(--ink); font-weight:600}

.stage{flex:1 1 auto; position:relative; perspective:820px; overflow:hidden}
.panel{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 14px 20px;
  opacity:1; transform:none;
  will-change:opacity;
}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:rgba(232,227,218,.18); border-radius:2px}
/* INTRO / OUTRO - a plain crossfade, nothing else. The panel used to fly in from depth while
   the text wrote itself on, so one moment carried two entrances and read as overdone. The text
   write-on below is the intro now; the panel only hands the stage over. */
@keyframes panelOut{ from{opacity:1} to{opacity:0} }
@keyframes panelIn { from{opacity:0} to{opacity:1} }
.panel.out{animation:panelOut .17s var(--ease-out) forwards}
.panel.in {animation:panelIn  .14s var(--ease-out) forwards}

/* THE TEXT IS WRITTEN, NOT FADED IN. Each block is revealed left to right by a clip edge - a
   raster sweep, the way a terminal actually puts characters on a screen. The curve is LINEAR,
   not the ease-out every other entrance here uses: a print head travels at a constant rate, and
   a strong ease-out put the sweep 96.6%% of the way across at half its duration - measured - so
   there was nothing left to watch. clip-path is the one
   non-transform property that is safe to animate here; it does not trigger layout.

   TWO variants on purpose. The machine's own labels glow as they are written and cool behind
   the sweep, which is what sells the phosphor idea. The prose does NOT glow: text-shadow
   repaints every frame, and the blurb and the entry rows carry by far the most glyphs and the
   largest paint area on the panel. The look survives where it reads; the cost does not. */
@keyframes lineIn{
  from{clip-path:inset(0 100% 0 0)}
  to  {clip-path:inset(0 0 0 0)}
}
@keyframes lineInLit{
  0%  {clip-path:inset(0 100% 0 0); text-shadow:0 0 7px rgba(245,158,11,.95)}
  100%{clip-path:inset(0 0 0 0);    text-shadow:0 0 0 rgba(245,158,11,0)}
}
.eyebrow, .rule-lab{
  animation:lineInLit .3s linear backwards;
  animation-delay:calc(var(--i,0) * 40ms + 80ms);
}
.blurb, .entry{
  animation:lineIn .3s linear backwards;
  animation-delay:calc(var(--i,0) * 40ms + 80ms);
}
/* the title resolves out of scrambled glyphs rather than sweeping - see decode() below. It keeps
   the cooling glow so the two reveals read as one machine writing one screen. */
@keyframes titleIn{
  0%  {text-shadow:0 0 9px rgba(245,158,11,.95)}
  100%{text-shadow:0 0 0 rgba(245,158,11,0)}
}
h1.writing{animation:titleIn .42s var(--ease-out)}

.eyebrow{
  display:flex; align-items:center; gap:8px; margin-bottom:12px;
  font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--dim);
  text-transform:uppercase; font-variant-numeric:tabular-nums;
}
.plate{
  flex:0 0 auto; height:24px; padding:0 10px; border-radius:6px;
  display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.01em;
  text-transform:none; color:var(--foil);
  background:linear-gradient(180deg,#22262A,#141719);
  box-shadow:inset 0 1px 0 rgba(255,217,160,.16), inset 0 0 0 1px rgba(0,0,0,.6);
}
h1{
  margin:0 0 6px; font-family:var(--sans); font-weight:600; font-size:23px; line-height:1.14;
  letter-spacing:-.014em; color:var(--ink); text-wrap:balance;
}
.blurb{margin:0 0 16px; font-size:13.5px; line-height:1.55; color:#B8B2A6; max-width:34ch}
.rule-lab{
  display:flex; align-items:baseline; gap:8px; margin:0 0 9px;
  font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--dim);
  text-transform:uppercase; font-variant-numeric:tabular-nums;
}
.rule-lab .line,
.eyebrow .line{flex:1 1 auto; height:1px; background:var(--hair)}

.entry{
  display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:0 10px;
  padding:10px 0; border-bottom:1px solid var(--hair);
}
.entry:last-child{border-bottom:0}
.idx{
  font-family:var(--mono); font-size:10px; color:var(--dim); padding-top:2px;
  font-variant-numeric:tabular-nums; letter-spacing:.04em;
}
.etitle{font-size:14px; font-weight:600; line-height:1.3; color:var(--ink)}
.edesc{grid-column:2/4; margin-top:3px; font-size:12.5px; line-height:1.5; color:#9A948A}
.chip{
  align-self:start; font-family:var(--mono); font-size:8.5px; letter-spacing:.12em;
  padding:3px 6px; border-radius:3px; text-transform:uppercase; white-space:nowrap;
}
.chip.ready{color:#0E1012; background:var(--foil); font-weight:600}
.chip.soon{color:var(--dim); box-shadow:inset 0 0 0 1px var(--hair-2)}

.foot{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:6px 10px; border-top:1px solid var(--hair);
  font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; color:var(--dim);
  text-transform:uppercase; font-variant-numeric:tabular-nums;
}
.ticks{flex:1 1 auto; height:6px; background:repeating-linear-gradient(90deg, var(--hair-2) 0 1px, transparent 1px 6px)}

/* RIGHT EDGE - the section rail (the hero) */
.rail{
  display:flex; flex-direction:column; gap:2px; padding:2px 0;
  transform:translateZ(15px); transform-style:preserve-3d;
  perspective:620px;            /* each cap now has its own vanishing point, so Z reads as depth */
}
.key{
  flex:1 1 0; min-height:22px;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
  padding:0 7px; border:0; border-radius:6px; cursor:pointer;
  font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.01em;
  color:var(--dim); text-align:left; white-space:nowrap;
  background:linear-gradient(180deg,#23272B,#15181B);
  box-shadow:
    inset 0 1px 0 rgba(255,217,160,.10),
    inset 0 -1px 0 rgba(0,0,0,.75),
    inset 0 0 0 1px rgba(0,0,0,.55),
    0 1px 2px rgba(0,0,0,.55),
    0 3px 5px -3px rgba(0,0,0,.8);
  transform:translateZ(0);
  transform-style:preserve-3d;
  transition:transform .18s cubic-bezier(.3,.7,.3,1), color .16s linear,
             background .16s linear, box-shadow .18s ease;
}
/* AN UNLIT LAMP IS A DARK BEZEL. The old one was rgba(232,227,218,.13) - a visible grey pip on
   every single cap, so the rail read as seventeen lights that were already on. */
/* A LAMP IS BLACK UNTIL IT IS LIT. No grey pip, no dim preview of the lit state. */
.key .lamp{
  flex:0 0 auto; width:4px; height:4px; border-radius:50%;
  background:#000;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.9), 0 0 0 .5px rgba(232,227,218,.055);
  transition:background .2s linear, box-shadow .2s linear;
}
.key.read{color:#A9A296}
.key.read .lamp{background:var(--lit-dim); box-shadow:0 0 3px rgba(245,158,11,.28)}

/* THE LATCH. A pressed cap goes DOWN and STAYS down until another one is pressed - it never
   floats above the rail. Down means: pushed back in Z, no drop shadow of its own (a sunken
   key casts none), and a hard inset shadow across its top edge where the housing overhangs it.
   The face ILLUMINATES to the one lit amber, which is what makes a latched key readable at a
   glance without lifting it off the panel. */
.key.on{
  color:#2A1A08; font-weight:600;
  background:linear-gradient(180deg, var(--lit) 0%, #D4870A 100%);
  transform:translateZ(-7px) scale(.984);
  box-shadow:
    inset 0 2px 5px rgba(74,38,2,.5),
    inset 0 -1px 0 rgba(255,194,77,.45),
    inset 0 0 0 1px rgba(0,0,0,.55),
    0 0 7px rgba(245,158,11,.22);
}
/* the lamp BLOOMS as it energises, then settles. Its dark socket ring is what keeps it legible
   against the lit face - the lamp is lighter than the cap, the ring is darker than both. */
@keyframes lampOn{
  0%  {box-shadow:0 0 0 0    rgba(255,194,77,0),   0 0 0  rgba(245,158,11,0)}
  40% {box-shadow:0 0 0 2.6px rgba(58,30,2,.85), 0 0 10px rgba(255,194,77,.95)}
  100%{box-shadow:0 0 0 1.4px rgba(58,30,2,.75), 0 0 4px  rgba(255,194,77,.6)}
}
.key.on .lamp{
  background:var(--lit-hot);
  box-shadow:0 0 0 1.4px rgba(58,30,2,.75), 0 0 4px rgba(255,194,77,.6);
  animation:lampOn .42s cubic-bezier(.2,.7,.3,1);
}
/* THE PRESS: straight down, a touch past the resting depth, then settle AT the bottom and stay
   there. It ends exactly where .key.on holds it, so nothing moves when the class is removed. */
@keyframes keyHit{
  0%  {transform:translateZ(0)     scale(1)}
  55% {transform:translateZ(-11px) scale(.976)}
  100%{transform:translateZ(-7px)  scale(.984)}
}
.key.hit{animation:keyHit .26s cubic-bezier(.3,.75,.35,1) forwards}
/* hover does NOT lift - a key that rises under the pointer is the floating look he rejected.
   It brightens its own edge instead, so the pad still answers the pointer. */
@media (hover:hover){
  .key:not(.on):hover{box-shadow:
    inset 0 1px 0 rgba(255,217,160,.20),
    inset 0 -1px 0 rgba(0,0,0,.75),
    inset 0 0 0 1px rgba(0,0,0,.55),
    0 1px 2px rgba(0,0,0,.55),
    0 3px 5px -3px rgba(0,0,0,.8);}
}
.key:focus-visible{outline:2px solid var(--foil); outline-offset:2px}

.fnpad{flex:0 0 auto; display:flex; flex-direction:column; gap:2px; margin-top:6px}
.fn{
  flex:0 0 25px;
  display:flex; align-items:center; justify-content:space-between; gap:3px;
  padding:0 6px; border:0; border-radius:6px; cursor:pointer;
  font-family:var(--mono); font-size:8.5px; font-weight:500; letter-spacing:.08em;
  color:var(--dim); background:linear-gradient(180deg,#1E2225,#121517);
  box-shadow:inset 0 1px 0 rgba(255,217,160,.07), inset 0 0 0 1px rgba(0,0,0,.55);
  transition:color .16s linear, box-shadow .16s linear;
}
.fn .st{font-size:8px; color:#6E685C}
.fn[aria-pressed="true"]{color:var(--foil); box-shadow:inset 0 0 0 1px rgba(255,140,26,.55)}
.fn[aria-pressed="true"] .st{color:var(--accent)}
.fn:disabled{opacity:.45; cursor:default}
.fn:focus-visible{outline:2px solid var(--foil); outline-offset:2px}

/* LITE MODE - motion and parallax go. Every colour and every word stays. */
body.lite .pad{transform:none; transition:none}
body.lite .panel,
body.lite .key,
body.lite .seg,
body.lite .fn{transition:none}
body.lite .panel.in,
body.lite .panel.out{animation:none; opacity:1; transform:none; filter:none}
body.lite .eyebrow,
body.lite .blurb,
body.lite .rule-lab,
body.lite .entry,
body.lite h1.writing{animation:none; clip-path:none; text-shadow:none}
body.lite .key.on{transform:none}
body.lite .key.hit,
body.lite .key.on .lamp,
body.lite .seg.cur{animation:none}
body.lite .seg.cur{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.4)}
body.lite .display,
body.lite .rail,
body.lite .meter{transform:none}

@keyframes rmFade{from{opacity:0} to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .pad,.panel,.key{transition:none !important}
  .panel.in,.panel.out{animation:none !important; opacity:1 !important; transform:none !important; filter:none !important}
  h1.writing{animation:none !important; text-shadow:none !important}
  .eyebrow,.blurb,.rule-lab,.entry{
    animation:rmFade .2s ease backwards !important;
    clip-path:none !important; text-shadow:none !important; transform:none !important}
  .key.hit,.key.on .lamp,.seg.cur{animation:none !important}
  .key.on{transform:none !important}
}
/* a caption for a desk viewer only — on a phone the pad fills the screen and
   a fixed line would lie across the housing */
.legend{display:none}
@media (min-width:900px){
  .legend{
    display:block; position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:#4A463F;
    text-transform:uppercase; pointer-events:none;
  }
}
</style>

<div class="frame">
  <div class="pad" id="pad">
    <div class="sheen"></div>
    <span class="bolt tl"></span><span class="bolt tr"></span>
    <span class="bolt bl"></span><span class="bolt br"></span>

    <div class="meter" id="meter" aria-hidden="true"></div>

    <div class="display">
      <div class="status">
        <span class="live"></span>
        <span>Ponder</span>
        <span class="sp"></span>
        <span>Section <b id="stIdx">01</b>/17</span>
      </div>
      <div class="stage" id="stage">
        <article class="panel" id="panel" tabindex="-1"></article>
      </div>
      <div class="foot">
        <span>KPM</span><span class="ticks"></span>
        <span>Modules ready <b id="stReady">00</b>/<span id="stTotal">00</span></span>
      </div>
    </div>

    <nav class="rail" id="rail" aria-label="Section list">
      <div class="fnpad">
        <button class="fn" id="btnLite" aria-pressed="false" type="button">LITE <span class="st">OFF</span></button>
        <button class="fn" id="btnTilt" aria-pressed="false" type="button">TILT <span class="st">OFF</span></button>
      </div>
    </nav>
  </div>
</div>
<p class="legend">Draf tech pad &mdash; geser layar atau tekan tombol section di kanan</p>

<script>
/* Data verbatim from src/ponder/sections.js. Order is sidebar order; entries inside a
   section are top-to-bottom order on the screen. `short` is verbatim from sections.js: the one-word tab label, and what a rail key-cap reads. */
var SECTIONS = [
 {id:'dashboard',short:'Command',label:'Command Center',blurb:'Angka ringkasan seluruh perusahaan. Cuma dibaca, tidak mengubah apa pun.',
  entries:[{title:'Membaca Command Center',desc:'Jendela 7 hari, dan mana yang bukan tren.',soon:true}]},
 {id:'restock_vault',short:'Restock',label:'Restock Vault',blurb:'Barang masuk dari pabrik, kirim ke cabang, dan di mana semua barang berada.',
  entries:[
   {title:'Goods Received',desc:'Panel paling atas: mencatat barang yang baru datang, dan biaya yang menempel padanya.'},
   {title:'Stock by Warehouse',desc:'Baca tabel gudang, dan kenapa tidak ada sisa hari untuk satu gudang penuh.'},
   {title:'Shipment Plan',desc:'Kalau barangnya tidak cukup untuk semua cabang, siapa yang dikirim duluan.'},
   {title:'Regional Warehouse',desc:'Panel gudang cabang: lima tab, scan barang sampai, alamat yang diatur HQ, dan data induk yang hanya bisa dibaca.'}]},
 {id:'sales',short:'Sales',label:'Sales Terminal',blurb:'Menjual, mencetak nota, dan apa yang tidak bisa ditarik lagi.',
  entries:[{title:'Titip vs Lunas',desc:'Beda barang titipan dan barang yang sudah dibayar.',soon:true}]},
 {id:'inventory',short:'Vault',label:'Master Vault',blurb:'Daftar barang, harga, dan siapa yang boleh mengubahnya.',
  entries:[{title:'Mengubah barang',desc:'Apa yang ikut berubah waktu harga diubah.',soon:true}]},
 {id:'agent_inventory',short:'Agent',label:'Agent Inventory',blurb:'Barang yang sedang dibawa salesman.',
  entries:[{title:'Stok di tangan agen',desc:'Sudah sampai, sudah bisa dijual, belum di rak.',soon:true}]},
 {id:'stock_opname',short:'Opname',label:'Stock Opname',blurb:'Hitung fisik, dan membandingkannya dengan catatan.',
  entries:[{title:'Hitung buta',desc:'Kenapa angka sistem sengaja disembunyikan saat menghitung.',soon:true}]},
 {id:'eod',short:'Setoran',label:'EOD Setoran',blurb:'Tutup hari: uang yang dihitung dibandingkan dengan apa.',

var pad=document.getElementById('pad'), rail=document.getElementById('rail'),
    meter=document.getElementById('meter'), panel=document.getElementById('panel'),
    stage=document.getElementById('stage'), fnpad=rail.querySelector('.fnpad'),
    stIdx=document.getElementById('stIdx'),
    stReady=document.getElementById('stReady'), stTotal=document.getElementById('stTotal');

var cur=0, read={}, lite=false, dwell=null, flight=null;
try{ read=JSON.parse(localStorage.getItem('ponderPadRead')||'{}')||{}; }catch(e){ read={}; }
function save(){ try{ localStorage.setItem('ponderPadRead',JSON.stringify(read)); }catch(e){} }

function pad2(n){ return (n<10?'0':'')+n; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

var totalEntries=0, readyEntries=0;
SECTIONS.forEach(function(s){ s.entries.forEach(function(e){ totalEntries++; if(!e.soon){ readyEntries++; } }); });
stReady.textContent=pad2(readyEntries);
stTotal.textContent=pad2(totalEntries);

var keys=[], segs=[];
SECTIONS.forEach(function(s,i){
  var b=document.createElement('button');
  b.className='key'; b.type='button';
  b.innerHTML='<span>'+s.short+'</span><span class="lamp"></span>';
  b.title=s.label;
  b.setAttribute('aria-label',s.label);
  b.addEventListener('click',function(){ go(i); });
  rail.insertBefore(b,fnpad); keys.push(b);
  var g=document.createElement('div'); g.className='seg'; meter.appendChild(g); segs.push(g);
});

/* ONE pass, ONE frame. The right key-cap lamp and the left edge segment are written in
   the same synchronous loop, so the two lights cannot disagree. */
function paint(){
  SECTIONS.forEach(function(s,i){
    var r=!!read[s.id];
    keys[i].className='key'+(r?' read':'')+(i===cur?' on':'');
    keys[i].setAttribute('aria-current', i===cur?'true':'false');
    segs[i].className='seg'+(r?' read':'')+(i===cur?' cur':'');
  });
  stIdx.textContent=pad2(cur+1);
}

function render(){
  var s=SECTIONS[cur], h='';
  /* no index here - the status strip already prints SECTION n/17, and one fact gets one
     indicator. Same reasoning that killed the hanging ribbon, and that killed DIBACA:
     the left edge meter is now the only thing reporting how much has been read. */
  h+='<div class="eyebrow" style="--i:0"><span class="plate">'+s.short+'</span><span class="line"></span></div>';
  h+='<h1>'+esc(s.label)+'</h1>';
  h+='<p class="blurb" style="--i:1">'+esc(s.blurb)+'</p>';
  h+='<div class="rule-lab" style="--i:2"><span>Content</span><span class="line"></span><span>'+pad2(s.entries.length)+'</span></div>';
  s.entries.forEach(function(e,j){
    h+='<div class="entry" style="--i:'+(j+3)+'">'
     + '<span class="idx">'+pad2(j+1)+'</span>'
     + '<span class="etitle">'+esc(e.title)+'</span>'
     + '<span class="chip '+(e.soon?'soon':'ready')+'">'+(e.soon?'Soon':'Ready')+'</span>'
     + '<span class="edesc">'+esc(e.desc)+'</span>'
     + '</div>';
  });
  panel.innerHTML=h;
  panel.scrollTop=0;
  decode(panel.querySelector('h1'), s.label, 420);
}

/* THE TITLE DECODES. Characters resolve left to right out of a technical glyph set - what a
   machine looks like while it is still working out what it is about to print. Spaces are never
   scrambled, so the shape of the words holds the whole way through and it reads as text
   resolving rather than as noise.
   Driven by setInterval, NOT requestAnimationFrame. rAF does not fire while the preview pane's
   document timeline is stalled, which would strand the title mid-scramble and look like a bug;
   setInterval keeps running, and discrete 32ms steps suit a decode anyway. */
var GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>[]{}';
var decodeTimer=null;
function decode(el, text, ms){
  clearInterval(decodeTimer);
  if(!el){ return; }
  if(lite){ el.textContent=text; el.classList.remove('writing'); return; }
  el.classList.add('writing');
  var t0=Date.now(), len=text.length;
  function tick(){
    var p=Math.min(1,(Date.now()-t0)/ms), settled=Math.floor(p*len), out='';
    for(var i=0;i<len;i++){
      var c=text.charAt(i);
      if(i<settled || c===' '){ out+=c; }
      else { out+=GLYPHS.charAt((Math.random()*GLYPHS.length)|0); }
    }
    el.textContent=out;
    if(p>=1){ clearInterval(decodeTimer); el.textContent=text; el.classList.remove('writing'); }
  }
  tick();
  decodeTimer=setInterval(tick,32);
}

var OUT_MS=170, IN_MS=140;
function go(i){
  if(i<0 || i>=SECTIONS.length || i===cur){ return; }
  clearTimeout(dwell); clearTimeout(flight);
  cur=i; paint();                 /* both lights, on the press itself, in one frame */
  hit(keys[i]);
  if(lite){ render(); markSoon(); return; }
  panel.classList.remove('in');
  panel.classList.add('out');
  flight=setTimeout(function(){
    render();
    panel.classList.remove('out');
    panel.classList.add('in');
    flight=setTimeout(function(){ panel.classList.remove('in'); }, IN_MS);
    markSoon();
  }, OUT_MS);
}
/* restart the depress even when the same cap is hammered - removing the class and reading
   offsetWidth forces the reflow that lets the animation play again */
function hit(el){
  if(lite){ return; }
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  setTimeout(function(){ el.classList.remove('hit'); },400);
}
function markSoon(){
  dwell=setTimeout(function(){
    if(!read[SECTIONS[cur].id]){ read[SECTIONS[cur].id]=1; save(); paint(); }
  },1100);
}

/* swipe across the display - horizontal only, so the panel can still scroll */
var sx=0, sy=0, tracking=false;
stage.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){ return; }
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
},{passive:true});
stage.addEventListener('touchend',function(e){
  if(!tracking){ return; }
  tracking=false;
  var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)*1.4){ go(cur + (dx<0?1:-1)); }
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ go(cur+1); }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ go(cur-1); }
});

/* LITE MODE */
var btnLite=document.getElementById('btnLite');
function setLite(on){
  lite=on;
  document.body.classList.toggle('lite',on);
  btnLite.setAttribute('aria-pressed',on?'true':'false');
  btnLite.querySelector('.st').textContent=on?'ON':'OFF';
  if(on){ pad.style.setProperty('--tx',0); pad.style.setProperty('--ty',0); }
}
btnLite.addEventListener('click',function(){ setLite(!lite); });
if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ setLite(true); }

/* TILT */
var btnTilt=document.getElementById('btnTilt'), tiltOn=false, raf=null,
    want={x:0,y:0}, have={x:0,y:0};
function loop(){
  have.x += (want.x-have.x)*.14; have.y += (want.y-have.y)*.14;
  pad.style.setProperty('--tx',have.x.toFixed(3));
  pad.style.setProperty('--ty',have.y.toFixed(3));
  raf=requestAnimationFrame(loop);
}
function clamp(v){ return v<-1?-1:(v>1?1:v); }
function onOrient(e){
  if(lite || e.gamma==null){ return; }
  want.x=clamp(e.gamma/26);
  want.y=clamp(((e.beta==null?45:e.beta)-45)/30);
}
function startTilt(){
  window.addEventListener('deviceorientation',onOrient);
  if(!raf){ loop(); }
  tiltOn=true;
  btnTilt.setAttribute('aria-pressed','true');
  btnTilt.querySelector('.st').textContent='ON';
}
function stopTilt(){
  window.removeEventListener('deviceorientation',onOrient);
  want.x=0; want.y=0; tiltOn=false;
  btnTilt.setAttribute('aria-pressed','false');
  btnTilt.querySelector('.st').textContent='OFF';
}
btnTilt.addEventListener('click',function(){
  if(tiltOn){ stopTilt(); return; }
  var D=window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission==='function'){
    D.requestPermission().then(function(r){
      if(r==='granted'){ startTilt(); }
      else { btnTilt.querySelector('.st').textContent='NO'; }
    })['catch'](function(){ btnTilt.querySelector('.st').textContent='NO'; });
  } else if(D){ startTilt(); }
  else { btnTilt.querySelector('.st').textContent='N/A'; btnTilt.disabled=true; }
});

/* pointer parallax on a desk, where there is no gyro */
if(window.matchMedia && matchMedia('(hover:hover)').matches){
  if(!raf){ loop(); }
  window.addEventListener('pointermove',function(e){
    if(lite||tiltOn){ return; }
    want.x=clamp((e.clientX/innerWidth - .5)*2);
    want.y=clamp((e.clientY/innerHeight - .5)*2);
  });
}

render(); paint(); markSoon();
</script>

<title>KPM Showcase Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap">
<style>
/* Layout: one scene = one screen. Phone: copy, the map table, the dock (keys or the salesman card) stacked.
   PC: copy + dock on the left, the table fills the right. Dark only, on purpose: this is the app's own
   dark Ark Lab, every colour copied from src/styles/theme.css so the showcase cannot drift from the app. */
@property --rz { syntax: '<angle>'; inherits: true; initial-value: -8deg; }
@property --gap { syntax: '<number>'; inherits: true; initial-value: 1; }
:root {
  color-scheme: dark;
  --ground: #0A0908; --sunk: #050403; --panel: #121110; --raised: #1B1917; --inset: #0E0D0C;
  --line: #26231F; --line-2: #3E3A35; --line-3: #6A645C;
  --ink: #E8E4DE; --ink-muted: #A39B90; --ink-dim: #928B81;
  --gold: #D08A2E; --gold-2: #E4B04A; --gold-ink: #0A0908;
  --led-crit: #FF3B4B; --led-warn: #FFB020;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --t: 46deg;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--font-body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

.hero { position: relative; min-height: 100svh; display: grid; grid-template-areas: "copy" "stage" "dock"; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
  gap: 14px; padding-inline: 16px; padding-block: 22px 84px; overflow: hidden;
  background: radial-gradient(110% 60% at 0% 0%, rgba(208,138,46,.11), transparent 62%), var(--ground); }
.copy { grid-area: copy; min-width: 0; }
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 340px; display: grid; place-items: center; perspective: 1500px; perspective-origin: 50% 18%; }
.dock { grid-area: dock; min-width: 0; }
.look-b .stage { overflow: hidden; -webkit-mask-image: radial-gradient(ellipse 58% 56% at 50% 50%, #000 66%, transparent 100%); mask-image: radial-gradient(ellipse 58% 56% at 50% 50%, #000 66%, transparent 100%); }
/* name tags float above the table in screen space, so a bar or an upper plate can never hide a word */
.tags { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.tags .tag { position: absolute; left: 0; top: 0; }
.anc { width: 1px; height: 1px; }
@media (min-width: 1024px) {
  .hero { grid-template-areas: "copy stage" "dock stage"; grid-template-columns: minmax(400px, 500px) 1fr; grid-template-rows: 1fr auto;
    column-gap: 32px; padding-inline: 56px; padding-block: 48px 96px; }
  .copy { align-self: end; }
  .dock { align-self: start; }
  .stage { min-height: 0; }
}

.eyebrow { font: 700 11px/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
h1 { font: 900 clamp(40px, 11.2vw, 86px)/.9 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 12px 0 0; text-wrap: balance; }
.lead { color: var(--ink-muted); font-size: 15px; max-width: 46ch; margin: 12px 0 0; }
.where { margin-top: 10px; font: 700 10px/1.4 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.where b { color: var(--ink); font-weight: 700; }
@media (min-width: 1024px) { h1 { font-size: 72px; } .lead { font-size: 17px; } }

/* ---- the layer keys: latched push buttons, black lamp off, one amber lamp on (his rule 2026-09-03) ---- */
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 6px 8px; border: 1px solid var(--line-3); border-radius: 8px;
  background: var(--raised); color: var(--ink-muted); font: 700 10px/1.25 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; text-align: left; cursor: pointer;
  transition: transform 140ms var(--ease-out); -webkit-tap-highlight-color: transparent; }
.key:active { transform: scale(.97); }
.key i { flex: 0 0 9px; height: 9px; border-radius: 50%; background: #000; border: 1px solid var(--line-3); }
.key[aria-pressed="true"] { background: var(--inset); color: var(--ink); border-color: var(--gold); }
.key[aria-pressed="true"] i { background: radial-gradient(circle, #fff 0 1px, var(--gold-2) 2px); border-color: var(--gold); }
.key:focus-visible, .sw button:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
@media (min-width: 1024px) { .key { font-size: 11px; min-height: 52px; } }

/* ---- the table ---- */
.rig { position: relative; transform-style: preserve-3d; }
.plate { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1; transform-style: preserve-3d; border: 1px solid var(--line-2); border-radius: 6px;
  background: var(--panel); transform: translateY(calc(var(--k, 0) * var(--gap) * var(--u) * 330)) rotateX(var(--t)) rotateZ(var(--rz)) var(--cam, ); }
.plate > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 6px; }
.edge-f, .edge-r { position: absolute; background: linear-gradient(var(--line-2), var(--sunk)); }
.edge-f { left: -1px; right: -1px; top: 100%; height: calc(var(--u) * 46); transform-origin: 50% 0; transform: rotateX(-90deg); border-top: 1px solid var(--gold); }
.edge-r { top: -1px; bottom: -1px; left: 100%; width: calc(var(--u) * 46); transform-origin: 0 50%; transform: rotateY(90deg); background: linear-gradient(90deg, var(--line-2), var(--sunk)); }

.grid line { stroke: rgba(232,228,222,.045); stroke-width: 1; }
.grid .maj { stroke: rgba(232,228,222,.09); }
.frame { fill: none; stroke: var(--line-3); stroke-width: 2; }
.tick { stroke: var(--line-3); stroke-width: 2; }
.cell { stroke: none; }
.bound { fill: none; stroke: var(--line-2); stroke-width: 2.5; stroke-linejoin: round; }
.supply { fill: none; stroke: var(--gold); stroke-width: 4; stroke-dasharray: 10 14; stroke-linecap: round; opacity: .9; }
.plan { fill: none; stroke: var(--line-3); stroke-width: 3.5; stroke-dasharray: 1 10; stroke-linecap: round; }
.done { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.st { fill: var(--inset); stroke: var(--line-3); stroke-width: 3; }
.st.hit { fill: var(--gold-2); stroke: var(--gold); }
.dim { opacity: .2; }
[data-off~="heat"] .L-heat, [data-off~="route"] .L-route, [data-off~="supply"] .L-supply { visibility: hidden; }

/* things that stand ON the table: they face the viewer by undoing the table's own tilt */
.bb { position: absolute; translate: -50% -100%; transform-origin: 50% 100%; pointer-events: none;
  transform: translateZ(var(--lift, 2px)) rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--t) * -1)); }
.tag { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line-3); border-radius: 4px; padding: 5px 7px; white-space: nowrap; }
.tag.hq { color: var(--gold-2); border-color: var(--gold); }
.tag.layer { display: grid; gap: 4px; padding: 7px 9px; }
.tag.layer small { font-size: 9px; color: var(--ink-dim); letter-spacing: .12em; }
.man { display: grid; justify-items: center; }
.man b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--gold-2);
  font: 800 9px/1 var(--font-mono); color: var(--ink); letter-spacing: .02em; }
.man i { width: 2px; height: 10px; background: linear-gradient(var(--gold-2), transparent); }
.bar { width: calc(var(--u) * 12); height: calc(var(--u) * var(--h) * 2.6); }
.look-b .num { width: 13px; height: 13px; font-size: 7px; }
.look-b .man b { width: 18px; height: 18px; font-size: 6px; border-width: 1.5px; }
.look-b .man i { height: 6px; }
.bar i { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; transform: scaleY(0); border: 1px solid var(--gold); border-bottom: 0;
  background: linear-gradient(var(--gold-2), var(--gold) 70%, #6b4514); transition: transform 520ms var(--ease-out); }
.bar.hit i { transform: scaleY(1); }
.num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--line-3);
  font: 800 10px/1 var(--font-mono); color: var(--ink-muted); }
.num.hit { background: var(--gold-2); border-color: var(--gold); color: var(--gold-ink); }
@media (min-width: 1024px) { .tag { font-size: 12px; padding: 6px 9px; } .tag.layer small { font-size: 10px; } .man b { width: 34px; height: 34px; font-size: 11px; } .man i { height: 14px; } .num { width: 24px; height: 24px; font-size: 11px; } }

.crate { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); transform-style: preserve-3d; }
.crate > i { position: absolute; inset: 0; border: 1px solid var(--line-3); background: var(--panel); }
.crate .top { transform: translateZ(var(--s)); background: linear-gradient(135deg, #2c2722, var(--raised)); border-color: var(--gold);
  background-image: linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)); background-size: 100% 2px, 2px 100%; background-position: 0 50%, 50% 0; background-repeat: no-repeat; background-color: var(--raised); }
.crate .f { transform-origin: 50% 100%; transform: rotateX(-90deg); background: linear-gradient(var(--raised), var(--panel)); }
.crate .bk { transform-origin: 50% 0; transform: rotateX(90deg); }
.crate .l { transform-origin: 0 50%; transform: rotateY(-90deg); background: var(--sunk); }
.crate .r { transform-origin: 100% 50%; transform: rotateY(90deg); background: linear-gradient(90deg, var(--panel), var(--sunk)); }

.stamp { grid-area: stage; justify-self: end; align-self: start; position: relative; z-index: 2; font: 700 9px/1 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 7px; background: var(--ground); }

/* look C: three thin plates, see-through so the one below still shows */
.look-c .plate { background: rgba(18,17,16,.74); }
.look-c .plate.p2 { background: rgba(18,17,16,.6); }
.look-c .edge-f, .look-c .edge-r { display: none; }

/* motion: only when on. Off (Lite Mode, reduced motion, the Diam key) every piece is still on the table */
.moving .rig.sway-a { animation: swayA 14s ease-in-out infinite; }
.moving .rig.sway-c { animation: swayC 16s ease-in-out infinite; }
.moving .rig.breathe { animation: breathe 10s ease-in-out infinite, swayC 16s ease-in-out infinite; }
.moving .supply { animation: flow 2.4s linear infinite; }
@keyframes swayA { 0%, 100% { --rz: -11deg; } 50% { --rz: -5deg; } }
@keyframes swayC { 0%, 100% { --rz: -13deg; } 50% { --rz: -8deg; } }
@keyframes breathe { 0%, 18%, 100% { --gap: 1; } 50%, 64% { --gap: .3; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
.still .bar i, .still .num { transition: none; }

/* ---- look B: the salesman's card (the app's player card head, its nixie counter, the stop list with diodes) ---- */
.card { border: 1px solid var(--line-2); border-radius: 14px; background: linear-gradient(180deg, var(--raised), var(--sunk)); padding: 12px; display: grid; gap: 10px; }
.card-head { display: flex; gap: 12px; align-items: center; }
.pho { flex: 0 0 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(160deg, #E4C98E, #B8893A);
  font: 900 18px/1 var(--font-mono); color: #2a1d08; outline: 2px solid #9aa3ad; outline-offset: 3px; }
.who { min-width: 0; flex: 1; }
.who .nm { font: 900 18px/1.05 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.who .rk { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 5px; }
.who .rk b { color: #b9c1ca; }
.cnt { text-align: right; }
.cnt .big { font: 900 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.cnt .big small { font-size: .55em; color: var(--ink-dim); }
.cnt .lbl, .om .lbl { font: 700 9px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 3px; }
.om { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.om .rp { font: 800 16px/1 var(--font-display); color: var(--ink-muted); margin-right: 6px; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stops li { display: none; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--inset); }
.stops li.near { display: grid; }
@media (min-width: 1024px) { .stops li.near, .stops li { display: none; } .stops li.nearpc { display: grid; } .stops li { min-height: 38px; } }
.stops .n { font: 800 11px/1 var(--font-mono); color: var(--ink-dim); }
.stops .s { font: 600 14px/1.2 var(--font-body); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.led { display: inline-flex; align-items: center; gap: 7px; font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
.led i { width: 8px; height: 8px; border-radius: 50%; background: #000; border: 1px solid var(--line-3); }
.led.on { color: var(--gold-2); } .led.on i { background: radial-gradient(circle, #fff 0 1px, var(--gold-2) 2px); border-color: var(--gold); }
.led.next { color: var(--led-warn); } .led.next i { background: radial-gradient(circle, #fff 0 1px, var(--led-warn) 2px); border-color: var(--led-warn); }
@media (min-width: 1024px) { .card { padding: 16px; gap: 12px; } .pho { flex-basis: 60px; height: 60px; } }

/* the nixie counter, from theme.css .kpm-nixie* (components/NixieCount.jsx) */
.kpm-nixie { display: inline-flex; align-items: center; gap: 3px; padding: 3px 4px; background-color: #000;
  background-image: linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px, transparent 55%, rgba(255,255,255,.025));
  border: 1px solid var(--line-2); border-radius: 4px; --nixie-ink: #FFB02E; font: 800 var(--nx, 22px)/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.kpm-nixie-tube { position: relative; width: .66em; height: 1.18em; overflow: hidden; border-radius: 2px; background: radial-gradient(70% 80% at 50% 50%, rgba(255,150,40,.10), transparent 72%); }
.kpm-nixie-reel { position: absolute; left: 0; right: 0; top: 0; display: grid; text-align: center; translate: 0 calc(var(--i, 0) * -1.18em); transition: translate 420ms cubic-bezier(.23,1,.32,1); transition-delay: var(--d, 0ms); }
.kpm-nixie-reel > span { height: 1.18em; line-height: 1.18em; color: rgba(255,176,46,.18); }
.kpm-nixie-reel > span.lit { color: var(--nixie-ink); }
.kpm-nixie .dot { color: rgba(255,176,46,.55); width: .25em; text-align: center; }
.still .kpm-nixie-reel { transition: none; }

/* ---- the option switch (this page only; the real showcase has no such bar) ---- */
.sw { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--ground); border-top: 1px solid var(--line-2); }
.sw button { min-height: 48px; border: 1px solid var(--line-3); border-radius: 8px; background: var(--raised); color: var(--ink-muted); cursor: pointer;
  font: 700 10px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; transition: transform 140ms var(--ease-out); }
.sw button:active { transform: scale(.97); }
.sw button b { display: block; font: 900 18px/1 var(--font-display); color: var(--ink); letter-spacing: .04em; }
.sw button[aria-pressed="true"] { background: var(--inset); border-color: var(--gold); color: var(--ink); }
.sw button[aria-pressed="true"] b { color: var(--gold-2); }
@media (min-width: 1024px) { .sw { left: 50%; right: auto; translate: -50% 0; width: 640px; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 12px 12px 0 0; } }
.shot .sw { display: none; }
.shot .hero { padding-bottom: 28px; }
@media (prefers-reduced-motion: reduce) { .kpm-nixie-reel, .bar i { transition: none; } }
</style>

<main class="hero" id="hero">
  <div class="copy">
    <div class="eyebrow" id="eyebrow">KPM · Peta Perjalanan</div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="where">Di aplikasi: <b>Journey Plan</b> + <b>Map System</b></div>
  </div>
  <div class="stage" id="stage"><div class="rig" id="rig"></div></div>
  <span class="stamp">Data contoh</span>
  <div class="dock" id="dock"></div>
  <div class="tags" id="tags"></div>
</main>

<nav class="sw" id="sw" aria-label="Pilih tampilan">
  <button type="button" data-look="a"><b>A</b>Meja</button>
  <button type="button" data-look="b"><b>B</b>Satu sales</button>
  <button type="button" data-look="c"><b>C</b>Tiga lapis</button>
  <button type="button" id="mv"><b>Gerak</b><span id="mvL">Nyala</span></button>
</nav>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const sv = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---- example data: one company, three branches, three salesmen, eight shops each. Marked "Data contoh" on the page ---- */
const rnd = mulberry32(20261002);
const HQ = { x: 500, y: 485 };
const BR = [{ x: 255, y: 262, n: 'Cabang Utara' }, { x: 770, y: 330, n: 'Cabang Timur' }, { x: 455, y: 785, n: 'Cabang Selatan' }];
const NAMES = ['Toko Berkah Jaya', 'Warung Sumber Rejeki', 'Toko Makmur', 'Warung Bu Sri', 'Toko Sinar Abadi', 'Warung Pojok', 'Toko Lancar', 'Warung Barokah'];
const SALES = [
  { ini: 'BS', name: 'Budi Santoso', br: 0, a0: 2.9, ph: .62 },
  { ini: 'AR', name: 'Ari Rahman', br: 1, a0: 4.2, ph: .5 },
  { ini: 'DW', name: 'Dewi Wulandari', br: 2, a0: 5.3, ph: .74 },
];
const clamp = (v) => Math.max(60, Math.min(940, v));
for (const s of SALES) {
  const b = BR[s.br];
  s.stores = Array.from({ length: 8 }, (_, i) => {
    const a = s.a0 + i * (1.5 * Math.PI / 8) + (rnd() - .5) * .22, r = 105 + rnd() * 85;
    return { x: clamp(b.x + Math.cos(a) * r), y: clamp(b.y + Math.sin(a) * r), sold: 10 + Math.round(rnd() * 30), name: NAMES[i] };
  });
  const pts = [b, ...s.stores]; let L = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); cum.push(L); }
  s.stores.forEach((st, i) => { st.f = cum[i + 1] / L; });
  s.d = smooth(pts);
}
function smooth(p) {
  let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${(p1.x + (p2.x - p0.x) / 6).toFixed(1)},${(p1.y + (p2.y - p0.y) / 6).toFixed(1)} ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)},${(p2.y - (p3.y - p1.y) / 6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
/* territories: a Voronoi split of the square, one cell per seed; a cell's revenue = the shops nearest its seed */
const SEEDS = [HQ, ...BR, { x: 90, y: 80 }, { x: 930, y: 90 }, { x: 80, y: 600 }, { x: 930, y: 720 }, { x: 760, y: 950 }, { x: 140, y: 960 }, { x: 560, y: 120 }];
function clip(poly, a, b) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = b.x - a.x, ny = b.y - a.y, side = (p) => (p.x - mx) * nx + (p.y - my) * ny, out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length], sp = side(P), sq = side(Q);
    if (sp <= 0) out.push(P);
    if ((sp <= 0) !== (sq <= 0)) { const t = sp / (sp - sq); out.push({ x: P.x + (Q.x - P.x) * t, y: P.y + (Q.y - P.y) * t }); }
  }
  return out;
}
const CELLS = SEEDS.map((s) => ({ poly: SEEDS.reduce((poly, o) => o === s ? poly : clip(poly, s, o), [{ x: 0, y: 0 }, { x: 1000, y: 0 }, { x: 1000, y: 1000 }, { x: 0, y: 1000 }]), rev: 0 }));
for (const s of SALES) for (const st of s.stores) {
  let best = 0, bd = Infinity; SEEDS.forEach((sd, i) => { const d = Math.hypot(sd.x - st.x, sd.y - st.y); if (d < bd) { bd = d; best = i; } });
  CELLS[best].rev += st.sold;
}
const maxRev = Math.max(...CELLS.map((c) => c.rev));
const ptsAttr = (poly) => poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

/* ---- one table, with the layers asked for ---- */
function plate(layers, opts = {}) {
  const p = el('div', 'plate' + (opts.cls ? ' ' + opts.cls : ''));
  const svg = sv('svg', { viewBox: '0 0 1000 1000', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  if (layers.includes('base')) {
    const g = sv('g', { class: 'grid' });
    for (let i = 1; i < 16; i++) { const v = i * 62.5, maj = i % 4 === 0 ? 'maj' : ''; g.append(sv('line', { x1: v, y1: 0, x2: v, y2: 1000, class: maj }), sv('line', { x1: 0, y1: v, x2: 1000, y2: v, class: maj })); }
    svg.append(g, sv('rect', { x: 10, y: 10, width: 980, height: 980, class: 'frame', rx: 4 }));
    for (let i = 1; i < 8; i++) { const v = i * 125; svg.append(sv('line', { x1: v, y1: 10, x2: v, y2: 28, class: 'tick' }), sv('line', { x1: 10, y1: v, x2: 28, y2: v, class: 'tick' })); }
  }
  if (layers.includes('heat')) {
    const g = sv('g', { class: 'L-heat' });
    for (const c of CELLS) g.append(sv('polygon', { points: ptsAttr(c.poly), class: 'cell', fill: `rgba(208,138,46,${(.03 + .34 * c.rev / maxRev).toFixed(3)})` }));
    svg.append(g);
  }
  if (layers.includes('base') || layers.includes('heat')) { const g = sv('g', {}); for (const c of CELLS) g.append(sv('polygon', { points: ptsAttr(c.poly), class: 'bound' })); svg.append(g); }
  if (layers.includes('supply')) {
    const g = sv('g', { class: 'L-supply' });
    for (const b of BR) { const mx = (HQ.x + b.x) / 2, my = (HQ.y + b.y) / 2, dx = b.x - HQ.x, dy = b.y - HQ.y; g.append(sv('path', { d: `M${HQ.x},${HQ.y} Q${mx - dy * .18},${my + dx * .18} ${b.x},${b.y}`, class: 'supply' })); }
    svg.append(g);
  }
  const refs = [];
  if (layers.includes('route')) {
    const g = sv('g', { class: 'L-route' });
    SALES.forEach((s, si) => {
      const sg = sv('g', { class: 'route r' + si + (opts.focus != null && opts.focus !== si ? ' dim' : '') });
      const plan = sv('path', { d: s.d, class: 'plan' }), done = sv('path', { d: s.d, class: 'done', pathLength: 1, 'stroke-dasharray': '1 1' });
      sg.append(plan, done);
      const dots = s.stores.map((st) => { const c = sv('circle', { cx: st.x, cy: st.y, r: 11, class: 'st' }); sg.append(c); return c; });
      g.append(sg);
      refs.push({ s, plan, done, dots, bars: [], nums: [], man: null });
    });
    svg.append(g);
  }
  p.append(svg);
  if (opts.slab !== false) p.append(el('div', 'edge-f'), el('div', 'edge-r'));
  const at = (node, x, y, lift) => { node.style.left = x / 10 + '%'; node.style.top = y / 10 + '%'; if (lift) node.style.setProperty('--lift', lift); p.append(node); return node; };
  if (layers.includes('supply')) {
    const crate = (x, y, s) => { const c = el('div', 'crate L-supply', '<i class="bk"></i><i class="l"></i><i class="r"></i><i class="f"></i><i class="top"></i>'); c.style.setProperty('--s', `calc(var(--u) * ${s})`); return at(c, x, y); };
    crate(HQ.x, HQ.y, 64); BR.forEach((b) => crate(b.x, b.y, 42));
  }
  /* a tag = an invisible 1 px anchor standing on the table + the word, drawn flat above everything */
  const tag = (html, cls, x, y, lift) => { anchors.push({ anc: at(el('div', 'bb anc'), x, y, lift), tag: el('div', 'tag ' + cls, html) }); };
  if (opts.tags) {
    tag('Gudang Pusat', 'hq', HQ.x, HQ.y, 'calc(var(--u) * 78)');
    BR.forEach((b) => tag(b.n, '', b.x, b.y, 'calc(var(--u) * 54)'));
  }
  if (opts.label) tag(opts.label, 'layer', 150, 110);
  for (const r of refs) {
    const si = SALES.indexOf(r.s), on = opts.focus == null || opts.focus === si;
    if (opts.bars && on) r.bars = r.s.stores.map((st) => { const b = el('div', 'bb bar L-heat', '<i></i>'); b.style.setProperty('--h', st.sold); return at(b, st.x, st.y); });
    if (opts.nums && on) r.nums = r.s.stores.map((st, i) => at(el('div', 'bb num L-route', String(i + 1)), st.x, st.y, 'calc(var(--u) * 14)'));
    if (on) r.man = at(el('div', 'bb man L-route', `<b>${r.s.ini}</b><i></i>`), r.s.stores[0].x, r.s.stores[0].y);
  }
  return { p, refs };
}

/* ---- the three looks ---- */
const COPY = {
  a: ['KPM · Peta Perjalanan', 'Semua sales. Semua toko. Satu peta.', 'Rute tiap sales, omzet tiap wilayah, dan jalur barang dari gudang ke warung. Bos melihat semuanya saat itu juga, dari teleponnya.'],
  b: ['KPM · Satu hari di lapangan', 'Dari gudang sampai warung terakhir.', 'Satu sales, satu hari. Toko mana yang sudah didatangi, berapa yang terjual, dan ke mana dia berikutnya. Bos melihatnya tanpa menelepon.'],
  c: ['KPM · Peta Perjalanan', 'Tiga pertanyaan. Satu peta.', 'Siapa pergi ke mana, di mana barang laku, dan barang sedang ada di mana. Tiga hal yang biasanya ada di tiga buku, di sini jadi satu peta.'],
};
const KEYS = [['route', 'Rute sales'], ['heat', 'Omzet wilayah'], ['supply', 'Jalur barang']];
let anchors = [];
let look = 'a', tables = [], moving = true, still = false, t0 = performance.now(), raf = 0;
const off = new Set();

function keysDock() {
  const k = el('div', 'keys');
  for (const [id, label] of KEYS) {
    const b = el('button', 'key', `<i></i><span>${label}</span>`); b.type = 'button'; b.id = 'key-' + id;
    b.setAttribute('aria-pressed', String(!off.has(id)));
    b.onclick = () => { off.has(id) ? off.delete(id) : off.add(id); b.setAttribute('aria-pressed', String(!off.has(id))); $('#rig').dataset.off = [...off].join(' '); };
    k.append(b);
  }
  return k;
}
function cardDock() {
  const s = SALES[0];
  const c = el('div', 'card');
  c.innerHTML = `<div class="card-head"><div class="pho">${s.ini}</div><div class="who"><div class="nm">${s.name}</div><div class="rk"><b>Silver</b> · ${BR[s.br].n}</div></div>
    <div class="cnt"><div class="big"><span id="hitN">0</span><small> / 8</small></div><div class="lbl">toko hari ini</div></div></div>
    <div class="om"><div><div class="lbl" style="margin:0 0 6px">Omzet hari ini</div><div style="display:flex;align-items:center"><span class="rp">Rp</span><span class="kpm-nixie" id="nx"></span></div></div></div>
    <ol class="stops" id="stops">${s.stores.map((st, i) => `<li><span class="n">${i + 1}</span><span class="s">${st.name}</span><span class="led"><i></i><b></b></span></li>`).join('')}</ol>`;
  return c;
}
/* the nixie: one black tube per digit, a 0-9 reel slides to the digit; dots between thousands */
const PRICE = 26000;
function nixieSet(n) {
  const host = $('#nx'); if (!host) return;
  /* always 7 digits as x.xxx.xxx so the tubes never move; leading zeros stay unlit */
  const d = String(Math.max(0, Math.round(n))).padStart(7, '0'), first = d.search(/[1-9]/), str = d[0] + '.' + d.slice(1, 4) + '.' + d.slice(4);
  if (!host.childElementCount) host.innerHTML = [...str].map((ch, i) => ch === '.' ? '<span class="dot">.</span>' : `<span class="kpm-nixie-tube"><span class="kpm-nixie-reel" style="--d:${(str.length - i) * 30}ms">${[...'0123456789'].map((x) => `<span>${x}</span>`).join('')}</span></span>`).join('');
  let k = 0;
  [...host.children].forEach((tube, i) => {
    if (str[i] === '.') return;
    const reel = tube.firstChild, v = +str[i], lit = (first !== -1 && k >= first) || k === 6; k++;
    reel.style.setProperty('--i', v);
    [...reel.children].forEach((sp, j) => sp.classList.toggle('lit', lit && j === v));
  });
}

function build() {
  cancelAnimationFrame(raf);
  document.documentElement.className = (moving && !still ? 'moving' : 'still') + (shot ? ' shot' : '');
  const hero = $('#hero'); hero.className = 'hero look-' + look;
  const [eb, h, ld] = COPY[look]; $('#eyebrow').textContent = eb; $('#h1').textContent = h; $('#lead').textContent = ld;
  const rig = $('#rig'); rig.innerHTML = ''; rig.className = 'rig'; rig.dataset.off = [...off].join(' ');
  anchors = []; $('#tags').innerHTML = '';
  if (look === 'a') {
    rig.classList.add('sway-a'); rig.style.setProperty('--rz', '-8deg');
    tables = [plate(['base', 'heat', 'supply', 'route'], { tags: true, bars: true })];
  } else if (look === 'b') {
    rig.style.setProperty('--rz', '-4deg');
    const cx = SALES[0].stores.reduce((a, s) => a + s.x, BR[0].x) / 9, cy = SALES[0].stores.reduce((a, s) => a + s.y, BR[0].y) / 9;
    tables = [plate(['base', 'heat', 'supply', 'route'], { focus: 0, nums: true })];
    tables[0].p.style.setProperty('--cam', `scale(1.6) translate(${(500 - cx) / 10}%, ${(500 - cy) / 10}%)`);
  } else {
    rig.classList.add('breathe'); rig.style.setProperty('--rz', '-10deg');
    tables = [
      plate(['base', 'supply'], { cls: 'p3', label: '03 · Jalur barang<small>Barang ada di mana?</small>' }),
      plate(['heat'], { cls: 'p2', label: '02 · Omzet wilayah<small>Di mana barang laku?</small>', slab: false }),
      plate(['route'], { cls: 'p1', label: '01 · Rute sales<small>Siapa pergi ke mana?</small>', slab: false }),
    ];
    tables[0].p.style.setProperty('--k', 1); tables[1].p.style.setProperty('--k', 0); tables[2].p.style.setProperty('--k', -1);
  }
  for (const t of tables) rig.append(t.p);
  for (const a of anchors) $('#tags').append(a.tag);
  const dock = $('#dock'); dock.innerHTML = ''; dock.append(look === 'b' ? cardDock() : keysDock());
  document.querySelectorAll('.sw [data-look]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.look === look)));
  $('#mvL').textContent = moving && !still ? 'Nyala' : 'Mati';
  fit(); t0 = performance.now(); tick();
}

/* size the table to the stage; --u = one map unit in px, so crates, bars and pins scale with the table */
function fit() {
  const st = $('#stage'), w = st.clientWidth, h = st.clientHeight, phone = innerWidth < 1024, rig = $('#rig');
  let pw;
  if (look === 'a') pw = phone ? Math.min(w * 1.16, h * 1.1) : Math.min(w * .78, h * 1.15, 940);
  else if (look === 'b') pw = phone ? Math.min(w * .98, h * 1.25) : Math.min(w * .8, h * 1.1, 860);
  else pw = phone ? Math.min(w * .78, h * .72) : Math.min(w * .58, h * .7, 660);
  rig.style.width = pw + 'px'; rig.style.height = pw + 'px';
  document.documentElement.style.setProperty('--t', look === 'a' ? (phone ? '42deg' : '52deg') : look === 'b' ? (phone ? '36deg' : '40deg') : '58deg');
  for (const t of tables) t.p.style.setProperty('--u', pw / 1000 + 'px');
  rig.style.marginTop = look === 'a' && !phone ? '-4%' : '0';
  place();
}
/* move each floating word onto its anchor; runs every frame while the table moves, once when it is still */
function place() {
  const h = $('#hero').getBoundingClientRect();
  for (const { anc, tag } of anchors) { const r = anc.getBoundingClientRect(); tag.style.transform = `translate(${(r.left - h.left).toFixed(1)}px, ${(r.top - h.top).toFixed(1)}px) translate(-50%, -100%)`; }
}

/* the day: each salesman walks his route; a shop he passes lights, its bar rises, the counters move */
const LAP = 18000, HOLD = 2600;
function progress(si, now) {
  if (!moving || still) return SALES[si].ph;
  const t = (now - t0 + si * 2300) % (LAP + HOLD);
  return Math.min(1, t / LAP);
}
function tick() {
  const now = performance.now();
  for (const t of tables) for (const r of t.refs) {
    const si = SALES.indexOf(r.s), p = progress(si, now);
    r.done.setAttribute('stroke-dashoffset', String(1 - p));
    let hits = 0;
    r.s.stores.forEach((st, i) => {
      const hit = p >= st.f - .002; if (hit) hits++;
      r.dots[i].classList.toggle('hit', hit);
      if (r.bars[i]) r.bars[i].classList.toggle('hit', hit);
      if (r.nums[i]) r.nums[i].classList.toggle('hit', hit);
    });
    if (r.man) { const pt = r.plan.getPointAtLength(p * r.plan.getTotalLength()); r.man.style.left = pt.x / 10 + '%'; r.man.style.top = pt.y / 10 + '%'; }
    if (look === 'b' && si === 0) dayCard(r.s, hits);
  }
  place();
  if (moving && !still) raf = requestAnimationFrame(tick);
}
let lastHits = -1;
function dayCard(s, hits) {
  if (hits === lastHits && $('#hitN')?.textContent === String(hits)) return;
  lastHits = hits; $('#hitN').textContent = hits;
  nixieSet(s.stores.slice(0, hits).reduce((a, st) => a + st.sold * PRICE, 0));
  [...$('#stops').children].forEach((li, i) => {
    const led = li.querySelector('.led'), done = i < hits, next = i === hits;
    led.className = 'led' + (done ? ' on' : next ? ' next' : '');
    led.querySelector('b').textContent = done ? `${s.stores[i].sold} bks` : next ? 'Berikutnya' : 'Belum';
    li.classList.toggle('near', i === Math.min(hits, 7));
    li.classList.toggle('nearpc', i >= Math.min(hits - 1, 4) && i <= Math.max(hits + 2, 3));
  });
}

/* ---- the page's own controls: look via #a / #b / #c; "-still" stops motion; "-shot" also hides this bar ---- */
let shot = false;
function fromHash() {
  const h = location.hash.slice(1); look = /^[abc]/.test(h) ? h[0] : 'a';
  shot = h.includes('shot'); still = shot || h.includes('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  lastHits = -1; build();
}
document.querySelectorAll('.sw [data-look]').forEach((b) => b.onclick = () => { location.hash = b.dataset.look + (still && !shot ? '-still' : ''); });
$('#mv').onclick = () => { still = !still; moving = true; lastHits = -1; build(); };
addEventListener('hashchange', fromHash);
addEventListener('resize', () => { fit(); });
fromHash();
</script>
